name: life_calendar
description: "Life calendar in weeks"
publish_to: 'none'

version: 3.0.0+12

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  logger: ^2.5.0
  freezed_annotation: ^3.0.0
  sqflite: ^2.4.2
  json_annotation: ^4.12.0
  shared_preferences: ^2.5.3
  flutter_bloc: ^9.1.1
  go_router: ^17.3.0
  equatable: ^2.0.7
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  flutter_expandable_fab: ^2.5.2
  image_picker: ^1.2.0
  url_launcher: ^6.3.2
  path_provider: ^2.1.5
  flutter_archive: ^6.0.3
  file_saver: ^0.4.0
  file_picker: ^12.3.0
  path: ^1.9.1
  firebase_core: ^4.2.1
  firebase_crashlytics: ^5.0.5
  firebase_analytics: ^12.0.4
  home_widget: ^0.9.3
  flutter_local_notifications: ^22.0.1
  timezone: ^0.11.0
  flutter_timezone: ^4.1.1
  package_info_plus: ^10.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.3.4
  build_runner: ^2.4.15
  freezed: ^3.0.6
  json_serializable: ^6.9.5
  bloc_test: ^10.0.0
  mocktail: ^1.0.5

  # Build-time CLI tools only, not imported from lib/.
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.6

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/onboarding/
    - assets/
